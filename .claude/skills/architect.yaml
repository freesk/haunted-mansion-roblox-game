  ## Roblox-Specific Architecture Considerations

  When architecting Roblox/Luau solutions, ensure:

  - [ ] Service initialization order documented in ServerInit
  - [ ] Client-server boundary clearly defined
  - [ ] RemoteEvents/Functions have validation layer
  - [ ] State synchronization strategy defined (if multiplayer)
  - [ ] Player cleanup on disconnect handled
  - [ ] Data persistence uses ProfileService patterns
  - [ ] Character loading edge cases considered
  - [ ] FilteringEnabled architecture respected
  - [ ] Replication considerations for instances
  - [ ] Memory management in long-running servers

  ## Example Invocations

  - "Architect a solution for teammate survival scoring"
  - "Design a new ghost AI system that integrates with existing systems"
  - "Architect multiplayer state synchronization for furniture"
  - "Design a power-up system with inventory management"
  - "Architect a quest system that works with current round flow"

  ## Special Focus Areas

  User can specify focus:
  - "Architect with focus on scalability" → Emphasize extensibility and performance
  - "Architect with focus on minimal change" → Favor Option A approaches
  - "Architect with focus on best practices" → Favor Option B approaches
  - "Architect with focus on multiplayer" → Emphasize state sync and networking

  ## Self-Validation Questions (Meta-Architecture Review)

  Before presenting the architecture, ask yourself:

  1. **Is it necessary?** Could this be simpler?
  2. **Is it sufficient?** Does it handle all requirements and edge cases?
  3. **Is it consistent?** Does it follow existing patterns?
  4. **Is it maintainable?** Will developers understand this in 6 months?
  5. **Is it testable?** Can we verify it works?
  6. **Is it scalable?** Will it handle growth?
  7. **Is it pragmatic?** Is the complexity justified?
  8. **Is it secure?** (For Roblox: Can it be exploited?)

  ## Anti-Patterns to Avoid

  - **God Service** - Service with too many responsibilities
  - **Dependency Injection Hell** - Over-complicated dependency management
  - **Premature Abstraction** - Creating interfaces before knowing the variance
  - **Golden Hammer** - Applying same pattern to every problem
  - **Analysis Paralysis** - Over-analyzing instead of building
  - **Resume-Driven Architecture** - Using tech because it's trendy, not because it fits
  - **Cargo Cult Programming** - Copying patterns without understanding why

  ## Remember

  - **Architecture serves the product**, not the other way around
  - **Simple is better than clever**
  - **Consistency beats perfection** - follow existing patterns even if not ideal
  - **Think long-term, but ship short-term** - balance pragmatism with vision
  - **Document the "why"** - future developers need context
  - **Consider the team** - architecture should match team's expertise
  - **Iterate and improve** - architecture evolves; don't over-engineer v1
  - **Validate assumptions** - re-read code if your mental model seems off
