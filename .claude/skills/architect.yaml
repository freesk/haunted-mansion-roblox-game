  ## Code Examples

  ### Example 1: NewService.lua (Full Implementation)

  ```lua
  --[[
      NewService - [Brief description of responsibility]

      Responsibilities:
      - [Responsibility 1]
      - [Responsibility 2]

      Dependencies:
      - [Dependency 1]
      - [Dependency 2]
  ]]

  local ReplicatedStorage = game:GetService("ReplicatedStorage")
  local ServerScriptService = game:GetService("ServerScriptService")

  local GameConfig = require(ReplicatedStorage.Shared.GameConfig)

  local NewService = {}
  NewService.__index = NewService

  -- State
  local activeItems = {}

  -- Initialization
  function NewService:Init()
      print("[NewService] Initializing...")

      -- Setup event listeners
      -- Initialize state

      print("[NewService] Initialized")
  end

  -- Public Methods
  function NewService:MethodA(param1, param2)
      -- Validate inputs
      if type(param1) ~= "string" then
          warn("[NewService] Invalid param1")
          return false
      end

      -- Implementation
      -- ...

      return true
  end

  return NewService
  ```

  ### Example 2: Integration in ExistingModule.lua

  ```lua
  -- Add to top of ExistingModule.lua
  local NewService = require(ServerScriptService.Services.NewService)

  -- Replace old implementation
  function ExistingModule:UpdatedMethod(data)
      -- Old approach removed
      -- New approach: delegate to NewService
      local success = NewService:MethodA(data.field1, data.field2)

      if not success then
          warn("[ExistingModule] NewService operation failed")
          return false
      end

      return true
  end
  ```

  ### Example 3: ServerInit.server.lua Updates

  ```lua
  -- Add NewService initialization (ORDER MATTERS)
  local NewService = require(ServerScriptService.Services.NewService)

  -- Initialize services in correct order
  DataService:Init()        -- NewService depends on DataService
  NewService:Init()         -- Initialize before modules that use it
  ExistingModule:Init()     -- Uses NewService
  ```

